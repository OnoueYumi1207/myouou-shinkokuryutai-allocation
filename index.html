<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>聖明王院神国龍体之確証割り振り</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">聖明王院</p>
      <h1>神国龍体之確証割り振り</h1>
    </div>
    <div class="header-actions">
      <button id="printButton" class="button secondary" type="button">印刷</button>
      <button id="pdfButton" class="button primary" type="button">PDF保存</button>
    </div>
  </header>

  <main>
    <section class="toolbar" aria-label="護摩供選択">
      <label>
        対象年
        <select id="yearSelect"></select>
      </label>
      <label class="wide">
        護摩供
        <select id="ceremonySelect"></select>
      </label>
      <label>
        聖明王院〆切
        <input id="deadlineInput" type="datetime-local">
      </label>
      <button id="snapshotButton" class="button secondary" type="button">〆切時点として固定</button>
    </section>

    <section class="summary-band">
      <div>
        <span class="summary-label">シール対象</span>
        <strong id="totalEligible">0</strong>
      </div>
      <div>
        <span class="summary-label">立命行</span>
        <strong id="totalRitsumei">0</strong>
      </div>
      <div>
        <span class="summary-label">供養会</span>
        <strong id="totalKuyo">0</strong>
      </div>
      <div>
        <span class="summary-label">新規</span>
        <strong id="totalNew">0</strong>
      </div>
    </section>

    <section class="ceremony-info">
      <div>
        <h2 id="ceremonyTitle"></h2>
        <p id="ceremonyMeta"></p>
      </div>
      <div class="status-pill" id="snapshotStatus">下書き</div>
    </section>

    <section id="cards" class="cards" aria-label="伝道会一覧"></section>
  </main>

  <dialog id="editDialog">
    <form method="dialog" class="dialog-body">
      <div class="dialog-header">
        <h2 id="dialogTitle">名簿編集</h2>
        <button class="icon-button" value="cancel" aria-label="閉じる" type="submit">×</button>
      </div>
      <p class="hint">1行に1名ずつ貼り付けてください。前回名簿にいて今回消えた人は、不参加として薄い行で表示されます。</p>
      <label>
        立命行
        <textarea id="ritsumeiText" rows="12"></textarea>
      </label>
      <label>
        供養会
        <textarea id="kuyoText" rows="10"></textarea>
      </label>
      <div class="dialog-actions">
        <button class="button secondary" value="cancel" type="submit">キャンセル</button>
        <button id="saveNamesButton" class="button primary" value="default" type="button">保存</button>
      </div>
    </form>
  </dialog>

  <template id="cardTemplate">
    <article class="hall-card">
      <button class="card-top" type="button">
        <span class="hall-main">
          <span class="hall-title">
            <span class="hall-name"></span>
            <span class="range"></span>
          </span>
          <span class="manager-name"></span>
        </span>
      </button>
      <div class="card-stats"></div>
      <div class="card-detail" hidden>
        <div class="detail-actions">
          <button class="button secondary edit-names" type="button">名簿編集</button>
          <button class="button secondary auto-number" type="button">自動</button>
          <button class="button secondary manual-number" type="button">手動</button>
          <button class="button secondary show-undelivered" type="button">未配布のみ</button>
          <button class="button secondary show-all" type="button">全員</button>
          <button class="button secondary close-detail" type="button">閉じる</button>
        </div>
        <div class="people"></div>
      </div>
    </article>
  </template>

  <script src="./app.js"></script>
</body>
</html>
