<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>印刷用ページ | 聖明王院神国龍体之確証シール管理</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./print.css">
</head>
<body>
  <header class="screen-header">
    <a href="./index.html">管理画面に戻る</a>
    <h1>印刷用ページ</h1>
  </header>

  <main>
    <section class="screen-controls" aria-label="印刷する伝道会の選択">
      <label>伝道会<select id="hallSelect"></select></label>
      <label>護摩供<select id="ceremonyPrintSelect"></select></label>
      <div class="view-switch" role="group" aria-label="印刷内容">
        <button class="view-button" data-view="history" type="button">履歴一覧</button>
      </div>
      <button id="downloadPdfButton" type="button">PDF保存</button>
      <button id="printPageButton" type="button">印刷</button>
    </section>
    <p id="loadStatus" class="screen-status">読み込み中...</p>
    <section id="printContent" class="print-content" aria-live="polite"></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="./print.js"></script>
</body>
</html>
